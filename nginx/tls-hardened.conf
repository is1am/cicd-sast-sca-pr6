# Конфигурация «ПОСЛЕ»: только TLS 1.2/1.3, AEAD-шифры с ECDHE/DHE (Forward Secrecy), HSTS.
server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;      # HTTP только перенаправляет на HTTPS
}

server {
    listen 443 ssl http2;
    server_name localhost;

    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # Отключение уязвимых протоколов: SSLv2/v3, TLS 1.0, TLS 1.1
    ssl_protocols TLSv1.2 TLSv1.3;

    # Стойкие шифронаборы TLS 1.2 (TLS 1.3 использует свои AEAD-наборы автоматически)
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers on;
    ssl_ecdh_curve X25519:secp384r1:prime256v1;

    ssl_session_cache   shared:TLS:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;                   # тикеты ослабляют Forward Secrecy

    server_tokens off;

    # Заголовки безопасности (на прокси — даже если приложение их не выставит;
    # одноимённые заголовки приложения скрываются, чтобы не было дублей)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
